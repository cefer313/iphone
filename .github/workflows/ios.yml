name: iOS IPA

# GitHub-un macOS serverində iOS tətbiqini yığır (imzasız .ipa).
# iPhone-a quraşdırmaq üçün Sideloadly (Windows/Mac) ilə Apple ID-nizlə imzalayın.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx cap sync ios
      - name: Build unsigned archive
        working-directory: ios/App
        run: |
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Package IPA
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/BaxisiniDeyis.ipa" Payload
          ls -lh "$GITHUB_WORKSPACE/BaxisiniDeyis.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: baxisini-deyis-ios-ipa
          path: BaxisiniDeyis.ipa
