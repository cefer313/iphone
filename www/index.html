<!doctype html>
<html lang="az">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d3b3a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Baxışını dəyiş">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>Baxışını dəyiş</title>
  <meta name="description" content="Baxışını dəyiş — motivasiya və şəxsi inkişaf platforması.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Playfair+Display:ital,wght@0,700;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header" id="top">
    <div class="container header__inner">
      <a href="#top" class="logo">Baxışını <span>dəyiş</span></a>
      <nav class="nav" id="nav">
        <a href="#about" data-i18n="nav.about"></a>
        <a href="#programs" data-i18n="nav.programs"></a>
        <a href="#birge" data-i18n="nav.birge"></a>
        <a href="#articles" data-i18n="nav.articles"></a>
        <a href="#reviews" data-i18n="nav.reviews"></a>
        <a href="#contact" data-i18n="nav.contact"></a>
      </nav>
      <div class="header__right">
        <div class="lang" role="group" aria-label="Language">
          <button data-lang="az">AZ</button>
          <button data-lang="ru">RU</button>
          <button data-lang="en">EN</button>
        </div>
        <button class="burger" id="burger" aria-label="Menu"><span></span><span></span><span></span></button>
      </div>
    </div>
  </header>

  <main>
    <!-- HERO -->
    <section class="hero">
      <div class="container hero__inner">
        <div class="hero__text">
          <p class="eyebrow" data-i18n="hero.eyebrow"></p>
          <h1 data-i18n="hero.title"></h1>
          <p class="lead" data-i18n="hero.lead"></p>
          <div class="hero__actions">
            <a href="#programs" class="btn btn--primary" data-i18n="hero.cta1"></a>
            <a href="#about" class="btn btn--ghost" data-i18n="hero.cta2"></a>
          </div>
          <div class="stats">
            <div><strong>5 000+</strong><span data-i18n="stats.students"></span></div>
            <div><strong>120+</strong><span data-i18n="stats.trainings"></span></div>
            <div><strong>8</strong><span data-i18n="stats.years"></span></div>
          </div>
        </div>
        <div class="hero__visual" aria-hidden="true">
          <div class="eye">
            <div class="eye__iris"><div class="eye__pupil"></div></div>
          </div>
          <div class="quote-card">
            <p data-i18n="hero.quote"></p>
          </div>
        </div>
      </div>
    </section>

    <!-- ABOUT -->
    <section class="section" id="about">
      <div class="container about">
        <div class="about__photo" aria-hidden="true"><span>BD</span></div>
        <div>
          <p class="eyebrow" data-i18n="about.eyebrow"></p>
          <h2 data-i18n="about.title"></h2>
          <p data-i18n="about.p1"></p>
          <p data-i18n="about.p2"></p>
          <ul class="checks">
            <li data-i18n="about.c1"></li>
            <li data-i18n="about.c2"></li>
            <li data-i18n="about.c3"></li>
          </ul>
        </div>
      </div>
    </section>

    <!-- PROGRAMS -->
    <section class="section section--alt" id="programs">
      <div class="container">
        <div class="section__head">
          <p class="eyebrow" data-i18n="programs.eyebrow"></p>
          <h2 data-i18n="programs.title"></h2>
        </div>
        <div class="cards">
          <article class="card">
            <div class="card__icon">🌱</div>
            <h3 data-i18n="programs.p1.title"></h3>
            <p data-i18n="programs.p1.text"></p>
            <div class="card__meta"><span data-i18n="programs.p1.meta"></span><strong>49 ₼</strong></div>
            <a href="#contact" class="btn btn--small" data-i18n="programs.join"></a>
          </article>
          <article class="card card--featured">
            <div class="badge" data-i18n="programs.popular"></div>
            <div class="card__icon">🚀</div>
            <h3 data-i18n="programs.p2.title"></h3>
            <p data-i18n="programs.p2.text"></p>
            <div class="card__meta"><span data-i18n="programs.p2.meta"></span><strong>149 ₼</strong></div>
            <a href="#contact" class="btn btn--small btn--primary" data-i18n="programs.join"></a>
          </article>
          <article class="card">
            <div class="card__icon">🎯</div>
            <h3 data-i18n="programs.p3.title"></h3>
            <p data-i18n="programs.p3.text"></p>
            <div class="card__meta"><span data-i18n="programs.p3.meta"></span><strong>99 ₼</strong></div>
            <a href="#contact" class="btn btn--small" data-i18n="programs.join"></a>
          </article>
        </div>
      </div>
    </section>

    <!-- DAILY QUOTE -->
    <section class="daily">
      <div class="container daily__inner">
        <p class="eyebrow" data-i18n="daily.eyebrow"></p>
        <blockquote id="dailyQuote"></blockquote>
        <button class="btn btn--light" id="nextQuote" data-i18n="daily.next"></button>
      </div>
    </section>

    <!-- BIRGƏ (İCMA) -->
    <section class="section birge" id="birge">
      <div class="container">
        <div class="section__head">
          <p class="eyebrow" data-i18n="birge.eyebrow"></p>
          <h2 data-i18n="birge.title"></h2>
          <p class="birge__lead" data-i18n="birge.lead"></p>
        </div>

        <div class="formats">
          <article class="format">
            <div class="format__icon">🤝</div>
            <h3 data-i18n="birge.f1.title"></h3>
            <p data-i18n="birge.f1.text"></p>
            <span class="format__meta" data-i18n="birge.f1.meta"></span>
          </article>
          <article class="format">
            <div class="format__icon">🔥</div>
            <h3 data-i18n="birge.f2.title"></h3>
            <p data-i18n="birge.f2.text"></p>
            <span class="format__meta" data-i18n="birge.f2.meta"></span>
          </article>
          <article class="format">
            <div class="format__icon">💬</div>
            <h3 data-i18n="birge.f3.title"></h3>
            <p data-i18n="birge.f3.text"></p>
            <span class="format__meta" data-i18n="birge.f3.meta"></span>
          </article>
        </div>

        <div class="birge__grid">
          <div class="events">
            <h3 data-i18n="birge.events.title"></h3>
            <ul class="events__list">
              <li class="event">
                <div class="event__date"><strong>21</strong><span data-i18n="month.nov"></span></div>
                <div class="event__info"><h4 data-i18n="birge.e1.title"></h4><p data-i18n="birge.e1.meta"></p></div>
                <a href="#contact" class="btn btn--small event__btn" data-program="birge" data-i18n="birge.join"></a>
              </li>
              <li class="event">
                <div class="event__date"><strong>28</strong><span data-i18n="month.nov"></span></div>
                <div class="event__info"><h4 data-i18n="birge.e2.title"></h4><p data-i18n="birge.e2.meta"></p></div>
                <a href="#contact" class="btn btn--small event__btn" data-program="birge" data-i18n="birge.join"></a>
              </li>
              <li class="event">
                <div class="event__date"><strong>05</strong><span data-i18n="month.dec"></span></div>
                <div class="event__info"><h4 data-i18n="birge.e3.title"></h4><p data-i18n="birge.e3.meta"></p></div>
                <a href="#contact" class="btn btn--small event__btn" data-program="birge" data-i18n="birge.join"></a>
              </li>
            </ul>
          </div>

          <div class="challenge">
            <p class="eyebrow" data-i18n="birge.ch.eyebrow"></p>
            <h3 data-i18n="birge.ch.title"></h3>
            <p class="challenge__text" data-i18n="birge.ch.text"></p>
            <div class="challenge__days" id="challengeDays" role="group"></div>
            <div class="challenge__bar"><span id="challengeBar"></span></div>
            <div class="challenge__foot">
              <p id="challengeStatus" role="status"></p>
              <button class="challenge__reset" id="challengeReset" type="button" data-i18n="birge.ch.reset"></button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- ARTICLES -->
    <section class="section" id="articles">
      <div class="container">
        <div class="section__head">
          <p class="eyebrow" data-i18n="articles.eyebrow"></p>
          <h2 data-i18n="articles.title"></h2>
        </div>
        <div class="articles">
          <article class="article">
            <div class="article__img a1"></div>
            <span class="tag" data-i18n="articles.a1.tag"></span>
            <h3 data-i18n="articles.a1.title"></h3>
            <p data-i18n="articles.a1.text"></p>
          </article>
          <article class="article">
            <div class="article__img a2"></div>
            <span class="tag" data-i18n="articles.a2.tag"></span>
            <h3 data-i18n="articles.a2.title"></h3>
            <p data-i18n="articles.a2.text"></p>
          </article>
          <article class="article">
            <div class="article__img a3"></div>
            <span class="tag" data-i18n="articles.a3.tag"></span>
            <h3 data-i18n="articles.a3.title"></h3>
            <p data-i18n="articles.a3.text"></p>
          </article>
        </div>
      </div>
    </section>

    <!-- REVIEWS -->
    <section class="section section--alt" id="reviews">
      <div class="container">
        <div class="section__head">
          <p class="eyebrow" data-i18n="reviews.eyebrow"></p>
          <h2 data-i18n="reviews.title"></h2>
        </div>
        <div class="reviews">
          <figure class="review"><blockquote data-i18n="reviews.r1"></blockquote><figcaption>— Aysel M.</figcaption></figure>
          <figure class="review"><blockquote data-i18n="reviews.r2"></blockquote><figcaption>— Rəşad Q.</figcaption></figure>
          <figure class="review"><blockquote data-i18n="reviews.r3"></blockquote><figcaption>— Nigar H.</figcaption></figure>
        </div>
      </div>
    </section>

    <!-- CONTACT -->
    <section class="section" id="contact">
      <div class="container contact">
        <div>
          <p class="eyebrow" data-i18n="contact.eyebrow"></p>
          <h2 data-i18n="contact.title"></h2>
          <p data-i18n="contact.text"></p>
          <ul class="contact__list">
            <li>📍 <span data-i18n="contact.address"></span></li>
            <li>📞 <a href="tel:+994000000000">+994 00 000 00 00</a></li>
            <li>✉️ <a href="mailto:info@baxisinideyis.az">info@baxisinideyis.az</a></li>
          </ul>
          <div class="socials">
            <a href="#" aria-label="Instagram">Instagram</a>
            <a href="#" aria-label="YouTube">YouTube</a>
            <a href="#" aria-label="Telegram">Telegram</a>
          </div>
        </div>
        <form class="form" id="contactForm" novalidate>
          <label><span data-i18n="form.name"></span><input name="name" required></label>
          <label><span data-i18n="form.phone"></span><input name="phone" type="tel" required></label>
          <label><span data-i18n="form.program"></span>
            <select name="program">
              <option data-i18n="programs.p1.title"></option>
              <option data-i18n="programs.p2.title"></option>
              <option data-i18n="programs.p3.title"></option>
              <option value="birge" data-i18n="birge.option"></option>
            </select>
          </label>
          <label><span data-i18n="form.message"></span><textarea name="message" rows="4"></textarea></label>
          <button type="submit" class="btn btn--primary" data-i18n="form.send"></button>
          <p class="form__status" id="formStatus" role="status"></p>
        </form>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <a href="#top" class="logo">Baxışını <span>dəyiş</span></a>
      <p>© <span id="year"></span> Baxışını dəyiş. <span data-i18n="footer.rights"></span></p>
    </div>
  </footer>

  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
